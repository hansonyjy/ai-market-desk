# Runs on every push and pull request. No secrets are used or needed.
name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[sheets]"
      - name: Unit and end-to-end tests (offline, no keys)
        run: for t in tests/test_*.py; do echo "== $t"; python "$t" > /dev/null || exit 1; done
      - name: The demo runs with no keys
        run: |
          if [ -f demo/fixtures/open/index.json ]; then env -u ANTHROPIC_API_KEY -u FINNHUB_KEY desk demo; \
          else echo "no recording yet"; fi
  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan the full history for secrets (gitleaks)
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar xz gitleaks
          ./gitleaks git . --no-banner --redact -v
