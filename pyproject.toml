[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-market-desk"
version = "1.0.0"
description = "A multi-agent market desk: watches the Nasdaq-100, explains moves with sources, argues three views, and grades itself."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Hanson Yang" }]
license = { text = "All rights reserved" }
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "requests>=2.31",
  "yfinance>=0.2.40",
  "python-dotenv>=1.0",
  "anthropic>=1.0",
  "exchange_calendars>=4.5",
]

[project.optional-dependencies]
sheets = ["gspread>=6.0"]
charts = ["matplotlib>=3.8"]

[project.scripts]
desk = "desk.cli:main"

[tool.setuptools.packages.find]
include = ["desk*"]

[tool.setuptools.package-data]
desk = ["config/*.json", "config/*.csv"]
