<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b9bb4"/>
    </marker>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#111a2e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="680" rx="18" fill="url(#bg)"/>
  <text x="40" y="52" fill="#e6edf7" font-size="24" font-weight="700">How a move becomes an email</text>
  <text x="40" y="80" fill="#8b9bb4" font-size="15">Code computes every number. Models only explain, and every claim needs a source.</text>

  <!-- lane labels -->
  <text x="40" y="128" fill="#5b6b86" font-size="12" font-weight="700" letter-spacing="1.5">EVERY 15 MINUTES · FREE</text>
  <text x="330" y="128" fill="#5b6b86" font-size="12" font-weight="700" letter-spacing="1.5">ONLY WHEN A RULE FIRES · AGENTS</text>
  <text x="905" y="128" fill="#5b6b86" font-size="12" font-weight="700" letter-spacing="1.5">TO YOUR INBOX</text>

  <!-- scanner -->
  <g>
    <rect x="40" y="145" width="250" height="150" rx="12" fill="#13203a" stroke="#2a3b5c"/>
    <text x="60" y="177" fill="#e6edf7" font-size="17" font-weight="700">Scanner</text>
    <text x="60" y="200" fill="#8b9bb4" font-size="13">plain rules on the S&P 500</text>
    <text x="60" y="226" fill="#c7d2e3" font-size="13">gaps · breakouts · volume spikes</text>
    <text x="60" y="246" fill="#c7d2e3" font-size="13">fast moves · 200-day pullbacks</text>
    <text x="60" y="266" fill="#c7d2e3" font-size="13">ranks hits · top 8 get read</text>
    <text x="60" y="286" fill="#5eead4" font-size="12" font-weight="600">no AI · $0</text>
  </g>
  <path d="M290 220 H325" stroke="#8b9bb4" stroke-width="2" marker-end="url(#a)"/>

  <!-- tape reader -->
  <g>
    <rect x="330" y="145" width="250" height="150" rx="12" fill="#1a1f3d" stroke="#4f46e5"/>
    <text x="350" y="177" fill="#e6edf7" font-size="17" font-weight="700">Tape Reader</text>
    <text x="350" y="200" fill="#a5b4fc" font-size="13">why is it moving, right now?</text>
    <text x="350" y="226" fill="#c7d2e3" font-size="13">news + web search</text>
    <text x="350" y="246" fill="#c7d2e3" font-size="13">buying, selling or noise</text>
    <text x="350" y="266" fill="#c7d2e3" font-size="13">no source, no claim</text>
    <text x="350" y="286" fill="#a5b4fc" font-size="12" font-weight="600">Sonnet · web search</text>
  </g>
  <path d="M580 220 H615" stroke="#8b9bb4" stroke-width="2" marker-end="url(#a)"/>

  <!-- three lenses -->
  <g>
    <rect x="620" y="145" width="250" height="68" rx="12" fill="#1a1f3d" stroke="#4f46e5"/>
    <text x="640" y="173" fill="#e6edf7" font-size="15" font-weight="700">Chartist lens</text>
    <text x="640" y="195" fill="#c7d2e3" font-size="12.5">levels, trend, DeMark, leadership</text>
    <rect x="620" y="227" width="250" height="68" rx="12" fill="#1a1f3d" stroke="#4f46e5"/>
    <text x="640" y="255" fill="#e6edf7" font-size="15" font-weight="700">Strategist lens</text>
    <text x="640" y="277" fill="#c7d2e3" font-size="12.5">liquidity, sentiment, breadth</text>
  </g>
  <text x="330" y="330" fill="#8b9bb4" font-size="12.5">Both lenses vote add / trim / watch,</text>
  <text x="330" y="349" fill="#8b9bb4" font-size="12.5">and they are allowed to disagree.</text>

  <!-- the call -->
  <g>
    <rect x="620" y="345" width="250" height="88" rx="12" fill="#132a26" stroke="#14b8a6"/>
    <text x="640" y="375" fill="#e6edf7" font-size="16" font-weight="700">The Call</text>
    <text x="640" y="398" fill="#99f6e4" font-size="13">fixed rules, not a model's mood</text>
    <text x="640" y="418" fill="#c7d2e3" font-size="12.5">watch · don't chase · add · trim</text>
  </g>
  <path d="M745 295 V340" stroke="#8b9bb4" stroke-width="2" marker-end="url(#a)"/>

  <!-- email -->
  <g>
    <rect x="905" y="145" width="255" height="150" rx="12" fill="#13203a" stroke="#2a3b5c"/>
    <text x="925" y="177" fill="#e6edf7" font-size="17" font-weight="700">Email</text>
    <text x="925" y="203" fill="#c7d2e3" font-size="13">10:00 opening digest</text>
    <text x="925" y="223" fill="#c7d2e3" font-size="13">live alerts, capped per day</text>
    <text x="925" y="243" fill="#c7d2e3" font-size="13">VIP breaking news</text>
    <text x="925" y="263" fill="#c7d2e3" font-size="13">evening earnings results</text>
    <text x="925" y="286" fill="#5eead4" font-size="12" font-weight="600">about $1 a day to run</text>
  </g>
  <path d="M870 389 C 890 389, 890 240, 900 240" fill="none" stroke="#8b9bb4" stroke-width="2" marker-end="url(#a)"/>

  <!-- ask the desk -->
  <g>
    <rect x="905" y="345" width="255" height="88" rx="12" fill="#1a1f3d" stroke="#4f46e5"/>
    <text x="925" y="375" fill="#e6edf7" font-size="16" font-weight="700">Ask the desk</text>
    <text x="925" y="398" fill="#c7d2e3" font-size="13">reply to any alert with a question;</text>
    <text x="925" y="418" fill="#c7d2e3" font-size="13">the right specialist answers in thread</text>
  </g>
  <path d="M1032 295 V340" stroke="#8b9bb4" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>

  <!-- feedback loop -->
  <rect x="40" y="480" width="1120" height="168" rx="14" fill="#0e1729" stroke="#22314f" stroke-dasharray="6 5"/>
  <text x="62" y="512" fill="#5b6b86" font-size="12" font-weight="700" letter-spacing="1.5">THE DESK GRADES ITSELF</text>
  <g>
    <rect x="62" y="530" width="245" height="92" rx="12" fill="#13203a" stroke="#2a3b5c"/>
    <text x="82" y="560" fill="#e6edf7" font-size="15" font-weight="700">Signal Log</text>
    <text x="82" y="583" fill="#c7d2e3" font-size="12.5">every hit, read, vote and</text>
    <text x="82" y="602" fill="#c7d2e3" font-size="12.5">email, kept for grading</text>
  </g>
  <path d="M307 576 H335" stroke="#8b9bb4" stroke-width="2" marker-end="url(#a)"/>
  <g>
    <rect x="340" y="530" width="245" height="92" rx="12" fill="#13203a" stroke="#2a3b5c"/>
    <text x="360" y="560" fill="#e6edf7" font-size="15" font-weight="700">Scorecard</text>
    <text x="360" y="583" fill="#c7d2e3" font-size="12.5">each read, lens and Call vs</text>
    <text x="360" y="602" fill="#c7d2e3" font-size="12.5">the market at 5 and 20 days</text>
  </g>
  <g>
    <rect x="618" y="530" width="245" height="92" rx="12" fill="#13203a" stroke="#2a3b5c"/>
    <text x="638" y="560" fill="#e6edf7" font-size="15" font-weight="700">Rule Lab</text>
    <text x="638" y="583" fill="#c7d2e3" font-size="12.5">backtests every rule against</text>
    <text x="638" y="602" fill="#c7d2e3" font-size="12.5">random days, with a placebo</text>
  </g>
  <g>
    <rect x="896" y="530" width="242" height="92" rx="12" fill="#13203a" stroke="#2a3b5c"/>
    <text x="916" y="560" fill="#e6edf7" font-size="15" font-weight="700">Health check</text>
    <text x="916" y="583" fill="#c7d2e3" font-size="12.5">every past bug is a daily</text>
    <text x="916" y="602" fill="#c7d2e3" font-size="12.5">check: pass or fail by email</text>
  </g>
  <path d="M1032 433 V470" stroke="#8b9bb4" stroke-width="2" stroke-dasharray="5 4"/>
  <path d="M745 433 V470" stroke="#8b9bb4" stroke-width="2" stroke-dasharray="5 4"/>
</svg>
